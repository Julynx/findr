[project]
name = "findr"
version = "1.1"
description = "Recursively search files"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "argsdict",
]

[project.scripts]
findr = "findr:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "black>=25.12.0",
    "pylint>=4.0.4",
]
